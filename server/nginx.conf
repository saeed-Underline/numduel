# Drop this inside your numduel `server { ... }` block (alongside the existing
# static `location /` and any other rules), then `sudo nginx -t && sudo systemctl reload nginx`.
#
# The block proxies `/ws` to the Node WebSocket relay on 127.0.0.1:9001 with the
# Upgrade / Connection headers required for the WebSocket handshake, and uses long
# read/send timeouts so idle connections aren't dropped mid-game.

location /ws {
    proxy_pass http://127.0.0.1:9001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
}

location = /health {
    proxy_pass http://127.0.0.1:9001/health;
    access_log off;
}

# Recommended: stop browsers from keeping an old index.html / app.js / CSS after a
# deploy (otherwise two players can end up on different versions and fail to join).
# Put this next to your static `location /` block; adjust `root` to your site folder.
